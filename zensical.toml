[project]
site_name = "CraftRail Documentation"
site_description = "Developer guide to CraftRail: a Git-native, agent-neutral framework for structured engineering intent and verification."
site_url = "https://craft-rail-docs.vercel.app"
docs_dir = "docs"
site_dir = "site"
exclude_docs = "/project/"
strict = true
nav = [
  { "Home" = "index.md" },
  { "1. Docs for adoption" = [
    "adoption/index.md",
    { "Get started" = [
      "framework/quickstart.md",
      "framework/github-template-usage.md",
      "framework/adoption-existing-project.md",
      "framework/overview.md",
      "framework/repository-structure.md",
      "framework/concepts.md",
    ] },
    { "Specify and design" = [
      "framework/requirements-writing-guide.md",
      "framework/feature-specification-guide.md",
      "framework/architecture-documentation-guide.md",
      "framework/diagrams-guide.md",
      "framework/adr-guide.md",
      "framework/contracts-guide.md",
    ] },
    { "Plan and verify" = [
      "framework/workflow.md",
      "framework/workflow-prompts.md",
      "framework/tasks-guide.md",
      "framework/traceability-and-verification.md",
      "framework/change-control.md",
      "examples/sample-feature-walkthrough.md",
    ] },
    { "Agents and reference" = [
      "framework/agent-compatibility.md",
      "framework/ecosystem-comparison.md",
      "framework/faq.md",
    ] },
  ] },
  { "2. Technical implementation of CraftRail" = [
    "implementation/index.md",
    { "Repository architecture" = [
      "framework/design-rationale.md",
    ] },
    { "Python and quality pipeline" = [
      "framework/python-quality.md",
      "framework/validation.md",
    ] },
    { "Documentation website" = "framework/documentation-site.md" },
    { "Critical review" = "implementation/critical-review.md" },
  ] },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "toc.follow",
]
favicon = "images/favicon.svg"

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
